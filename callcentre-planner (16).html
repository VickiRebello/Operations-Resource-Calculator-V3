            {/* ═══ SHIFTS TAB ═══ */}
            {activeTab === "shifts" && (() => {

              // Hour index helpers
              const hIdx = h => HOURS.indexOf(h);
              const hLabel = idx => idx < 24 ? HOURS[idx] : HOURS[idx - 24] + "+";

              // Build shifts for a given demand array + window
              function buildShifts(demandArr, windowStart, windowEnd, minH, maxH) {
                const raw = [];
                let i = windowStart;
                while (i < windowEnd) {
                  if ((demandArr[i] || 0) === 0) { i++; continue; }
                  let j = i;
                  while (j < windowEnd && (demandArr[j] || 0) > 0) j++;
                  let cursor = i;
                  while (cursor < j) {
                    let len = Math.min(maxH, j - cursor);
                    if (len < minH) len = j - cursor < minH ? j - cursor : minH;
                    const end = Math.min(cursor + len, windowEnd);
                    const peak = Math.max(...demandArr.slice(cursor, end).filter(Boolean));
                    if (peak > 0) raw.push({ start: cursor, end, duration: end - cursor, agents: peak });
                    cursor += len;
                  }
                  i = j;
                }
                // merge adjacent same-agents within maxH
                const merged = [];
                raw.forEach(s => {
                  const last = merged[merged.length - 1];
                  if (last && last.end === s.start && last.agents === s.agents && (s.end - last.start) <= maxH)
                    { last.end = s.end; last.duration = last.end - last.start; }
                  else merged.push({...s});
                });
                return merged.map(s => ({
                  ...s,
                  startLabel: HOURS[s.start % 24],
                  endLabel: hLabel(s.end),
                }));
              }

              const minH = shiftRules.minHours !== "" ? parseInt(shiftRules.minHours) : 4;
              const maxH = shiftRules.maxHours !== "" ? parseInt(shiftRules.maxHours) : 12;

              // For each team-window, for each day it covers, build demand and shifts
              function getWindowResults(tw) {
                const startH = tw.startHour;
                const endH = tw.endHour; // may be > 23 for overnight e.g. 25 = 1am next day
                const coversDays = DAYS.filter((_, di) => tw.days.includes(di));
                const dayResults = {};
                coversDays.forEach(day => {
                  // Build demand array 0-47 to handle overnight
                  const demand = Array.from({length: 48}, (_, hi) => {
                    const h = HOURS[hi % 24];
                    const v = tw.teamIdx === null
                      ? results[day][h].agents
                      : (results[day][h].teamSplit[tw.teamIdx]?.agents || 0);
                    return Math.ceil(v);
                  });
                  const shifts = buildShifts(demand, startH, endH, minH, maxH);
                  const totalAgentHours = shifts.reduce((s, sh) => s + sh.agents * sh.duration, 0);
                  dayResults[day] = { shifts, totalAgentHours };
                });
                return { coversDays, dayResults };
              }

              // ── Render ────────────────────────────────────────────────────
              const ShiftCard = ({ day, shifts, totalAgentHours, windowStart, windowEnd, color }) => (
                <div style={{ background: "#fff", border: "1px solid #e5e2dd", borderRadius: 10, overflow: "hidden" }}>
                  <div style={{ padding: "10px 14px 8px", borderBottom: "1px solid #f0ede8", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ fontSize: 15, fontWeight: 700 }}>{day}</div>
                    <div style={{ fontSize: 11, color: "#a09488" }}>
                      {shifts.length} shift{shifts.length !== 1 ? "s" : ""} · {totalAgentHours} agent-hrs
                    </div>
                  </div>
                  {shifts.length === 0
                    ? <div style={{ padding: "14px", fontSize: 12, color: "#c0b8b0", textAlign: "center" }}>No demand</div>
                    : <div style={{ padding: "10px 14px" }}>
                        <div style={{ position: "relative", height: 8, background: "#f5f3f0", borderRadius: 4, marginBottom: 10, overflow: "hidden" }}>
                          {shifts.map((sh, si) => (
                            <div key={si} style={{
                              position: "absolute", top: 0, height: "100%",
                              left: `${(sh.start / 24) * 100}%`,
                              width: `${(sh.duration / 24) * 100}%`,
                              background: color || `rgba(232,89,12,${0.4 + si * 0.15})`,
                              borderRadius: 3, opacity: 0.7 + si * 0.1,
                            }} />
                          ))}
                        </div>
                        {shifts.map((sh, si) => (
                          <div key={si} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "4px 0", borderBottom: si < shifts.length - 1 ? "1px solid #f5f3f0" : "none" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                              <div style={{ width: 9, height: 9, borderRadius: 2, background: color || "#e8590c", flexShrink: 0, opacity: 0.7 + si * 0.1 }} />
                              <span style={{ fontSize: 12.5, fontWeight: 600, color: "#1a1a1a" }}>{sh.startLabel} – {sh.endLabel}</span>
                              <span style={{ fontSize: 11, color: "#a09488" }}>{sh.duration}hr</span>
                            </div>
                            <div>
                              <span style={{ fontSize: 13, fontWeight: 700, color: "#e8590c" }}>{sh.agents}</span>
                              <span style={{ fontSize: 11, color: "#a09488", marginLeft: 3 }}>agents</span>
                            </div>
                          </div>
                        ))}
                      </div>
                  }
                </div>
              );

              return (
                <div>
                  {/* Shift rules — full width at top */}
                  <div style={{ background: "#fff", border: "1px solid #e5e2dd", borderRadius: 10, padding: 16, marginBottom: 20, display: "flex", gap: 32, alignItems: "flex-start", flexWrap: "wrap" }}>
                    <div style={{ flex: "0 0 auto" }}>
                      <div className="lxs">Shift Rules <span style={{ fontWeight: 400, letterSpacing: 0, textTransform: "none", color: "#b0a89e", fontSize: 10 }}>(optional)</span></div>
                      {[
                        { key: "minHours", label: "Min shift duration (hrs)", ph: "e.g. 4" },
                        { key: "maxHours", label: "Max shift duration (hrs)", ph: "e.g. 8" },
                      ].map(({ key, label, ph }) => (
                        <div key={key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 9, gap: 16 }}>
                          <label style={{ fontSize: 12, color: "#5a524c" }}>{label}</label>
                          <input type="number" min={1} max={24} className="pi" style={{ width: 70 }}
                            value={shiftRules[key]} placeholder={ph}
                            onChange={e => setShiftRules(r => ({ ...r, [key]: e.target.value }))} />
                        </div>
                      ))}
                      <div style={{ fontSize: 11, color: "#a09488" }}>Defaults: 4hr min, 12hr max</div>
                    </div>
                  </div>

                  {/* ── Grand total summary bar ── */}
                  {(() => {
                    const allTotals = teamWindows.map(tw => {
                      const { coversDays, dayResults } = getWindowResults(tw);
                      const total = coversDays.reduce((s, day) => s + dayResults[day].totalAgentHours, 0);
                      return { id: tw.id, name: tw.name, color: tw.color, total };
                    });
                    const grandTotal = allTotals.reduce((s, t) => s + t.total, 0);
                    const filteredTotal = activeWindowFilter !== null
                      ? (allTotals.find(t => t.id === activeWindowFilter)?.total || 0)
                      : grandTotal;
                    return (
                      <div style={{ background: "#fff", border: "1px solid #e5e2dd", borderRadius: 10, padding: "14px 18px", marginBottom: 16 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                          <div>
                            <div className="lxs" style={{ marginBottom: 2 }}>Total Agent-Hours</div>
                            <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                              <span style={{ fontSize: 28, fontWeight: 700, color: activeWindowFilter !== null ? (allTotals.find(t => t.id === activeWindowFilter)?.color || "#e8590c") : "#1a1a1a" }}>{filteredTotal}</span>
                              <span style={{ fontSize: 13, color: "#a09488" }}>agent-hrs {activeWindowFilter !== null ? "(filtered)" : "across all windows"}</span>
                            </div>
                          </div>
                          <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", justifyContent: "flex-end" }}>
                            <span style={{ fontSize: 11.5, color: "#8a8178", fontWeight: 500 }}>Filter:</span>
                            <button
                              className={`tgb ${activeWindowFilter === null ? "on" : ""}`}
                              onClick={() => setActiveWindowFilter(null)}>All</button>
                            {allTotals.map(t => (
                              <button key={t.id}
                                className={`tgb ${activeWindowFilter === t.id ? "on" : ""}`}
                                style={activeWindowFilter === t.id ? { background: t.color, borderColor: t.color } : {}}
                                onClick={() => setActiveWindowFilter(activeWindowFilter === t.id ? null : t.id)}>
                                <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                                  <span style={{ width: 8, height: 8, borderRadius: 2, background: t.color, display: "inline-block", flexShrink: 0 }} />
                                  {t.name}
                                </span>
                              </button>
                            ))}
                          </div>
                        </div>
                        {/* Stacked bar */}
                        <div style={{ height: 8, background: "#f5f3f0", borderRadius: 4, overflow: "hidden", display: "flex" }}>
                          {allTotals.filter(t => t.total > 0).map(t => (
                            <div key={t.id} style={{
                              height: "100%",
                              width: `${grandTotal > 0 ? (t.total / grandTotal) * 100 : 0}%`,
                              background: t.color,
                              opacity: activeWindowFilter === null || activeWindowFilter === t.id ? 1 : 0.2,
                              transition: "opacity 0.2s",
                            }} />
                          ))}
                        </div>
                        {grandTotal > 0 && (
                          <div style={{ display: "flex", gap: 14, marginTop: 8, flexWrap: "wrap" }}>
                            {allTotals.filter(t => t.total > 0).map(t => (
                              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, opacity: activeWindowFilter === null || activeWindowFilter === t.id ? 1 : 0.4, transition: "opacity 0.2s" }}>
                                <div style={{ width: 8, height: 8, borderRadius: 2, background: t.color, flexShrink: 0 }} />
                                <span style={{ color: "#5a524c" }}>{t.name}:</span>
                                <span style={{ fontWeight: 600, color: t.color }}>{t.total}</span>
                                <span style={{ color: "#a09488" }}>({grandTotal > 0 ? Math.round((t.total/grandTotal)*100) : 0}%)</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {/* Team windows + results — one row per window */}
                  <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                      <div className="lxs" style={{ marginBottom: 0 }}>Team Windows &amp; Suggested Shift Patterns</div>
                      <button className="atb" onClick={() => setTeamWindows(tw => [...tw, {
                        id: Date.now(), name: "New Team Window", color: "#888",
                        days: [0,1,2,3,4], startHour: 9, endHour: 17, teamIdx: null
                      }])}>+ Add team window</button>
                    </div>
                    {teamWindows.length === 0 && (
                      <div style={{ padding: 32, textAlign: "center", color: "#a09488", fontSize: 13, background: "#fff", border: "1px solid #e5e2dd", borderRadius: 10 }}>
                        Add a team window to see suggested shift patterns
                      </div>
                    )}
                    {teamWindows.filter(tw => activeWindowFilter === null || tw.id === activeWindowFilter).map((tw, wi) => {
                      const { coversDays, dayResults } = getWindowResults(tw);
                      return (
                        <div key={tw.id} style={{ background: "#fff", border: `1.5px solid ${tw.color}22`, borderLeft: `4px solid ${tw.color}`, borderRadius: 10, overflow: "hidden" }}>
                          {/* Row header: window config */}
                          <div style={{ display: "flex", gap: 0, alignItems: "stretch" }}>
                            {/* Config panel */}
                            <div style={{ width: 300, flexShrink: 0, padding: 14, borderRight: "1px solid #f0ede8", background: "#faf9f7" }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                                <input className="ti" style={{ flex: 1, marginRight: 8, fontWeight: 600, fontSize: 12 }}
                                  value={tw.name}
                                  onChange={e => setTeamWindows(tws => tws.map((t, i) => i === wi ? {...t, name: e.target.value} : t))} />
                                <input type="color" value={tw.color} style={{ width: 24, height: 24, border: "none", background: "none", cursor: "pointer", padding: 0 }}
                                  onChange={e => setTeamWindows(tws => tws.map((t, i) => i === wi ? {...t, color: e.target.value} : t))} />
                                <button className="rm" style={{ marginLeft: 4 }}
                                  onClick={() => setTeamWindows(tws => tws.filter((_, i) => i !== wi))}>×</button>
                              </div>
                              {/* Days */}
                              <div style={{ display: "flex", gap: 3, marginBottom: 8, flexWrap: "wrap" }}>
                                {DAYS.map((d, di) => (
                                  <button key={d}
                                    onClick={() => setTeamWindows(tws => tws.map((t, i) => i === wi ? {
                                      ...t, days: t.days.includes(di) ? t.days.filter(x => x !== di) : [...t.days, di].sort()
                                    } : t))}
                                    style={{
                                      padding: "2px 6px", borderRadius: 4, fontSize: 11, fontWeight: 600, cursor: "pointer",
                                      background: tw.days.includes(di) ? tw.color : "#fff",
                                      color: tw.days.includes(di) ? "#fff" : "#8a8178",
                                      border: `1.5px solid ${tw.days.includes(di) ? tw.color : "#ddd9d3"}`,
                                    }}>{d}</button>
                                ))}
                              </div>
                              {/* Hours */}
                              <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 8 }}>
                                <span style={{ fontSize: 11, color: "#a09488", width: 28, flexShrink: 0 }}>From</span>
                                <select className="ti" style={{ flex: 1, fontSize: 11 }}
                                  value={tw.startHour}
                                  onChange={e => setTeamWindows(tws => tws.map((t, i) => i === wi ? {...t, startHour: parseInt(e.target.value)} : t))}>
                                  {Array.from({length: 24}, (_, hi) => <option key={hi} value={hi}>{HOURS[hi]}</option>)}
                                </select>
                                <span style={{ fontSize: 11, color: "#a09488", width: 12, textAlign: "center" }}>to</span>
                                <select className="ti" style={{ flex: 1, fontSize: 11 }}
                                  value={tw.endHour}
                                  onChange={e => setTeamWindows(tws => tws.map((t, i) => i === wi ? {...t, endHour: parseInt(e.target.value)} : t))}>
                                  {Array.from({length: 24}, (_, hi) => <option key={hi+1} value={hi+1}>{hi + 1 < 24 ? HOURS[hi+1] : "12am (next)"}</option>)}
                                  <option value={25}>1am (next)</option>
                                  <option value={26}>2am (next)</option>
                                  <option value={27}>3am (next)</option>
                                  <option value={28}>4am (next)</option>
                                  <option value={29}>5am (next)</option>
                                  <option value={30}>6am (next)</option>
                                  <option value={31}>7am (next)</option>
                                  <option value={32}>8am (next)</option>
                                  <option value={33}>9am (next)</option>
                                  <option value={34}>10am (next)</option>
                                  <option value={35}>11am (next)</option>
                                  <option value={36}>12pm (next)</option>
                                  <option value={37}>1pm (next)</option>
                                </select>
                              </div>
                              {/* Team filter */}
                              <div style={{ display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap" }}>
                                <span style={{ fontSize: 11, color: "#a09488", marginRight: 2 }}>Team:</span>
                                <button
                                  onClick={() => setTeamWindows(tws => tws.map((t, i) => i === wi ? {...t, teamIdx: null} : t))}
                                  style={{ padding: "2px 7px", borderRadius: 4, fontSize: 11, cursor: "pointer", fontWeight: 600,
                                    background: tw.teamIdx === null ? "#1a1a1a" : "#fff",
                                    color: tw.teamIdx === null ? "#fff" : "#8a8178",
                                    border: `1.5px solid ${tw.teamIdx === null ? "#1a1a1a" : "#ddd9d3"}` }}>All</button>
                                {teams.map((t, ti) => (
                                  <button key={ti}
                                    onClick={() => setTeamWindows(tws => tws.map((tw2, i) => i === wi ? {...tw2, teamIdx: tw2.teamIdx === ti ? null : ti} : tw2))}
                                    style={{ padding: "2px 7px", borderRadius: 4, fontSize: 11, cursor: "pointer", fontWeight: 600,
                                      background: tw.teamIdx === ti ? TEAM_COLORS[ti % TEAM_COLORS.length] : "#fff",
                                      color: tw.teamIdx === ti ? "#fff" : "#8a8178",
                                      border: `1.5px solid ${tw.teamIdx === ti ? TEAM_COLORS[ti % TEAM_COLORS.length] : "#ddd9d3"}` }}>{t.name}</button>
                                ))}
                              </div>
                            </div>
                            {/* Results for this window */}
                            <div style={{ flex: 1, padding: 14, display: "flex", flexDirection: "column", gap: 10 }}>
                              <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
                                {coversDays.length === 0
                                  ? <div style={{ fontSize: 12, color: "#c0b8b0", alignSelf: "center", padding: "0 12px" }}>Select days to see shifts</div>
                                  : coversDays.map(day => (
                                      <ShiftCard key={day} day={day}
                                        shifts={dayResults[day].shifts}
                                        totalAgentHours={dayResults[day].totalAgentHours}
                                        windowStart={tw.startHour} windowEnd={tw.endHour}
                                        color={tw.color} />
                                    ))
                                }
                              </div>
                              {coversDays.length > 0 && (() => {
                                const windowTotal = coversDays.reduce((s, day) => s + dayResults[day].totalAgentHours, 0);
                                return (
                                  <div style={{ borderTop: "1px solid #f0ede8", paddingTop: 8, display: "flex", alignItems: "center", gap: 8 }}>
                                    <div style={{ width: 10, height: 10, borderRadius: 2, background: tw.color, flexShrink: 0 }} />
                                    <span style={{ fontSize: 12, color: "#5a524c", fontWeight: 600 }}>{tw.name} total:</span>
                                    <span style={{ fontSize: 15, fontWeight: 700, color: tw.color }}>{windowTotal}</span>
                                    <span style={{ fontSize: 12, color: "#a09488" }}>agent-hrs across {coversDays.length} day{coversDays.length !== 1 ? "s" : ""}</span>
                                  </div>
                                );
                              })()}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>
              );
            })()}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
